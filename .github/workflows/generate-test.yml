name: Сгенерировать тест

# Эта кнопка появится во вкладке "Actions" репозитория -> "Сгенерировать тест" -> "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile generator
        run: javac -d out src/ComboTestGenerator.java

      - name: Generate test
        run: java -cp out ComboTestGenerator

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ControlWork/Test-Combo.html README.md
          git diff --cached --quiet || git commit -m "Сгенерирован новый комбинированный тест"
          git push
